<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PocketFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080B12;--card:rgba(38,43,58,.55);--bd:rgba(255,255,255,.12);--tx:#fff;--mu:#9aa3b5;--p:#A78BFA;--b:#60A5FA;--m:#6EE7B7;--r:#fb7185;--in:rgba(255,255,255,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{--bg:#eef1f8;--card:rgba(255,255,255,.65);--bd:rgba(0,0,0,.08);--tx:#0c1020;--mu:#5d667a;--in:rgba(0,0,0,.05)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body:before,body:after{content:"";position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none}
body:before{background:var(--p);top:-90px;left:-80px}body:after{background:var(--b);bottom:-100px;right:-90px}
#root{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:18px 18px calc(120px + env(safe-area-inset-bottom,0px))}
.g{background:var(--card);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--bd);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.card{padding:18px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu);font-size:13px}.cap{text-transform:capitalize}h1{font-size:26px;margin:0}h2{font-size:18px;margin:22px 0 12px}h3{margin:6px 0 14px;font-size:20px}
.big{font-size:38px;font-weight:800;letter-spacing:-1px;margin:2px 0}
.bar{height:9px;border-radius:9px;background:var(--in);overflow:hidden;display:flex}.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.btn{border:0;border-radius:18px;padding:15px;font:800 16px Manrope,sans-serif;color:#0b0b14;background:linear-gradient(135deg,var(--p),var(--b));cursor:pointer;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.s{background:var(--in);color:var(--tx);padding:12px 6px;font-size:14px;border:1px solid var(--bd)}.btn.d{background:rgba(251,113,133,.18);color:var(--r)}
.ic{width:38px;height:38px;border-radius:13px;background:var(--in);border:1px solid var(--bd);color:var(--tx);font-size:16px;cursor:pointer}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.cat{padding:16px;cursor:pointer;margin-bottom:12px;animation:up .45s both}.cat:active{transform:scale(.98)}
.e{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(444px,calc(100% - 28px));display:flex;padding:7px;border-radius:30px;z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:600 11px Manrope,sans-serif;padding:9px 0;border-radius:23px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;transition:.25s}
.nav button span{font-size:19px}.nav button.on{background:rgba(167,139,250,.22);color:var(--p)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.sh{width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;background:var(--card);animation:sl .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 12px}
input,select{width:100%;padding:14px;border-radius:16px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:600 16px Manrope,sans-serif;margin-bottom:10px;outline:0}
select option{color:#000}input:focus,select:focus{border-color:var(--p)}
label{font-size:12px;color:var(--mu);display:block;margin:2px 0 5px}
.seg{display:flex;background:var(--in);border-radius:16px;padding:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 4px;border-radius:12px;font:700 13px Manrope,sans-serif;cursor:pointer}.seg .on{background:rgba(167,139,250,.28);color:var(--tx)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.sw i{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-style:normal;font-size:18px;background:var(--in);border:2px solid transparent}.sw i.on{border-color:var(--tx)}
.tx{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.pill{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;flex:none}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;padding:14px 20px;border-radius:20px;font-weight:700;animation:up .4s;max-width:90%;text-align:center}
.empty{text-align:center;padding:22px 16px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const KEY='pocketflow-v3',CUR={PLN:'zł',EUR:'€',USD:'$'},ACC={konto:'Konto',sav:'Oszczędności'};
const COLORS=['#A78BFA','#60A5FA','#6EE7B7','#F9A8D4','#FCD34D','#FB923C'];
const ICONS=['🎮','👕','🍔','🎧','🚌','📚','🎁','⚽','💄','📱'];
const uid=()=>Math.random().toString(36).slice(2,9);
const empty=()=>({cur:'PLN',theme:'dark',income:0,cats:[],tx:[]});
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||empty()}catch(e){return empty()}};
const bal=(s,a)=>s.tx.reduce((v,t)=>v+(t.to===a?t.amt:0)-(t.from===a?t.amt:0),0);
const mstart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
const mout=(s,c)=>s.tx.filter(t=>t.k==='out'&&t.date>=mstart()&&(c===undefined||t.cat===c)).reduce((v,t)=>v+t.amt,0);
const fmt=(n,c)=>n.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+CUR[c];
const fd=d=>new Date(d).toLocaleDateString('pl-PL',{day:'numeric',month:'short',year:'numeric'});
const num=v=>parseFloat(String(v).replace(',','.'));

function Sheet({title,onClose,children}){return <div className="ov" onClick={onClose}><div className="sh g" onClick={e=>e.stopPropagation()}><div className="grab"/><h3>{title}</h3>{children}</div></div>}

function App(){
 const [S,setS]=useState(load),[tab,setTab]=useState('home'),[sheet,setSheet]=useState(null),[toast,setToast]=useState(null);
 useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}document.documentElement.dataset.theme=S.theme},[S]);
 const say=m=>{setToast(m);setTimeout(()=>setToast(null),3000)};
 const cur=S.cur,konto=bal(S,'konto'),sav=bal(S,'sav');
 const cats=S.cats.map(c=>({...c,sp:mout(S,c.id)}));
 const plans=cats.reduce((v,c)=>v+c.plan,0),free=S.income-plans;
 const cinfo=id=>S.cats.find(c=>c.id===id)||{icon:'•',name:'Bez kategorii',color:'#9aa3b5'};
 const open=(type,p)=>setSheet({type,...p});
 const commit=t=>{const c=cats.find(x=>x.id===t.cat);setS(s=>({...s,tx:[...s.tx,{...t,id:uid(),date:Date.now()}]}));
  if(t.k==='out'&&c&&c.plan>0&&c.sp+t.amt>c.plan)say('⚠️ Przekroczono limit: '+c.name);else say('Zapisano ✓')};
 const setBal=(a,v)=>{const d=v-bal(S,a);if(Math.abs(d)<0.005)return;setS(s=>({...s,tx:[...s.tx,{id:uid(),k:'fix',amt:Math.abs(d),from:d<0?a:null,to:d>0?a:null,date:Date.now()}]}))};
 const hist=[...S.tx].sort((a,b)=>b.date-a.date);
 const sel=(v,set,opts,l)=><><label>{l}</label><select value={v} onChange={e=>set(e.target.value)}>{opts.map(o=><option key={o[0]} value={o[0]}>{o[1]}</option>)}</select></>;

 const TxRow=({t})=>{const c={in:'var(--m)',out:'var(--r)',move:'var(--b)',fix:'var(--p)'}[t.k];
  const title=t.k==='fix'?'Korekta salda':t.desc||(t.k==='in'?'Wpłata':t.k==='out'?'Wydatek':'Przeniesienie');
  const sub=t.k==='out'?cinfo(t.cat).icon+' '+cinfo(t.cat).name+' · '+ACC[t.from]:t.k==='move'?ACC[t.from]+' → '+ACC[t.to]:ACC[t.to||t.from];
  const sign=t.k==='in'||(t.k==='fix'&&t.to)?'+':t.k==='out'||t.k==='fix'?'−':'';
  return <div className="tx"><div className="pill" style={{background:c+'26',color:c}}>{t.k==='in'?'↓':t.k==='out'?'↑':t.k==='move'?'⇄':'✎'}</div>
   <div style={{flex:1,minWidth:0}}><div style={{fontWeight:700}}>{t.k==='out'&&t.desc?t.desc:title}</div><div className="mu">{sub} · {fd(t.date)}</div></div>
   <b style={{color:c}}>{sign}{fmt(t.amt,cur)}</b></div>};

 const CatCard=({c,i})=>{const left=c.plan-c.sp,pc=c.plan?Math.min(100,c.sp/c.plan*100):0,over=left<0;
  return <div className="cat g" style={{animationDelay:i*50+'ms'}} onClick={()=>open('op',{k:'out',cat:c.id})}>
   <div className="row"><div className="row" style={{justifyContent:'flex-start',gap:12}}><div className="e" style={{background:c.color+'33'}}>{c.icon}</div>
    <div><div style={{fontWeight:800}}>{c.name}</div><div className="mu">wydano {fmt(c.sp,cur)} z {fmt(c.plan,cur)}</div></div></div>
    <button className="ic" onClick={e=>{e.stopPropagation();open('cat',{id:c.id})}}>✏️</button></div>
   <div className="bar" style={{margin:'12px 0 8px'}}><i style={{width:pc+'%',background:over?'var(--r)':c.color}}/></div>
   <div className="row"><span className="mu">{over?'Przekroczono o':'Zostało'}</span><b style={{color:over?'var(--r)':'var(--tx)'}}>{fmt(Math.abs(left),cur)}</b></div></div>};

 const Home=()=><>
  <div className="row"><div><h1>Hej! 👋</h1><div className="mu cap">{new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}</div></div>
   <button className="ic" onClick={()=>open('set')}>⚙️</button></div>
  <div className="g card" style={{marginTop:20}}><div className="row"><span className="mu">💳 Konto</span><button className="ic" onClick={()=>open('bal')}>✏️</button></div>
   <div className="big" style={{color:'var(--b)'}}>{fmt(konto,cur)}</div></div>
  <div className="g card"><div className="row"><span className="mu">🐷 Oszczędności</span><button className="ic" onClick={()=>open('bal')}>✏️</button></div>
   <div className="big" style={{color:'var(--m)'}}>{fmt(sav,cur)}</div><div className="mu">Razem: {fmt(konto+sav,cur)}</div></div>
  <div className="acts"><button className="btn s" onClick={()=>open('op',{k:'out'})}>− Wydaj</button><button className="btn s" onClick={()=>open('op',{k:'in'})}>＋ Wpłać</button><button className="btn s" onClick={()=>open('op',{k:'move'})}>⇄ Przenieś</button></div>
  <h2>Na co idą pieniądze</h2>
  {cats.length?cats.map((c,i)=><CatCard key={c.id} c={c} i={i}/>):<div className="g card empty"><p className="mu" style={{marginTop:0}}>Podziel kieszonkowe na kategorie, np. jedzenie, gry, ubrania.</p><button className="btn s" onClick={()=>open('cat',{id:null})}>＋ Dodaj kategorię</button></div>}</>;

 const Plan=()=>{const sp=mout(S);return <>
  <div className="row"><h1>Podział</h1><button className="ic" onClick={()=>open('cat',{id:null})}>＋</button></div>
  <div className="g card" style={{marginTop:18}}><div className="row"><span className="mu">Kieszonkowe miesięcznie</span><button className="ic" onClick={()=>open('inc')}>✏️</button></div>
   <div className="big">{fmt(S.income,cur)}</div>
   <div className="bar" style={{margin:'10px 0'}}>{cats.map(c=><i key={c.id} style={{width:(S.income?c.plan/S.income*100:0)+'%',background:c.color}}/>)}</div>
   <div className="row mu"><span>Rozdzielone: {fmt(plans,cur)}</span><b style={{color:free<0?'var(--r)':'var(--m)'}}>{free<0?'Za dużo o ':'Wolne: '}{fmt(Math.abs(free),cur)}</b></div>
   <div className="mu" style={{marginTop:6}}>Wydane w tym miesiącu: {fmt(sp,cur)}</div></div>
  {cats.map((c,i)=><CatCard key={c.id} c={c} i={i}/>)}
  {!cats.length&&<p className="mu">Brak kategorii. Kliknij ＋, żeby dodać pierwszą.</p>}</>};

 const Hist=()=><><h1>Historia</h1><div className="g card" style={{marginTop:18,paddingTop:6,paddingBottom:6}}>
  {hist.map(t=><TxRow key={t.id} t={t}/>)}{!hist.length&&<p className="mu">Brak operacji.</p>}</div></>;

 const Op=({k0,cat0})=>{
  const [k,setK]=useState(k0),[amt,setAmt]=useState(''),[acc,setAcc]=useState('konto'),[cat,setCat]=useState(cat0||''),[dir,setDir]=useState('konto'),[d,setD]=useState(''),[err,setErr]=useState('');
  const accs=[['konto','💳 Konto'],['sav','🐷 Oszczędności']];
  const go=()=>{const a=num(amt);if(!(a>0))return setErr('Wpisz poprawną kwotę');
   const src=k==='out'?acc:dir;if(k!=='in'&&a>bal(S,src)+1e-9)return setErr('Za mało środków (dostępne '+fmt(bal(S,src),cur)+')');
   if(k==='in')commit({k,amt:a,from:null,to:acc,desc:d.trim()});
   else if(k==='out')commit({k,amt:a,from:acc,to:null,cat,desc:d.trim()});
   else commit({k,amt:a,from:dir,to:dir==='konto'?'sav':'konto',desc:d.trim()});setSheet(null)};
  return <Sheet title="Nowa operacja" onClose={()=>setSheet(null)}>
   <div className="seg">{[['out','Wydaj'],['in','Wpłać'],['move','Przenieś']].map(([i,l])=><button key={i} className={k===i?'on':''} onClick={()=>{setK(i);setErr('')}}>{l}</button>)}</div>
   <label>Kwota ({CUR[cur]})</label><input inputMode="decimal" placeholder="0,00" value={amt} onChange={e=>setAmt(e.target.value)} style={{fontSize:28,fontWeight:800}} autoFocus/>
   {k==='out'&&<>{sel(cat,setCat,[['','Bez kategorii'],...S.cats.map(c=>[c.id,c.icon+' '+c.name])],'Na co')}{sel(acc,setAcc,accs,'Z')}</>}
   {k==='in'&&sel(acc,setAcc,accs,'Na')}
   {k==='move'&&sel(dir,setDir,[['konto','Konto → Oszczędności'],['sav','Oszczędności → Konto']],'Kierunek')}
   <label>Opis (opcjonalnie)</label><input value={d} onChange={e=>setD(e.target.value)} placeholder={k==='in'?'np. kieszonkowe':'np. pizza'}/>
   {err&&<p style={{color:'var(--r)',fontWeight:700,margin:'0 0 10px'}}>{err}</p>}
   <button className="btn" onClick={go}>{k==='in'?'Wpłać':k==='out'?'Odlicz':'Przenieś'}</button></Sheet>};

 const Bal=()=>{const [a,setA]=useState(String(+konto.toFixed(2))),[b,setB]=useState(String(+sav.toFixed(2)));
  const save=()=>{const x=num(a),y=num(b);if(!isNaN(x))setBal('konto',Math.round(x*100)/100);if(!isNaN(y))setBal('sav',Math.round(y*100)/100);say('Saldo zaktualizowane ✓');setSheet(null)};
  return <Sheet title="Ile masz pieniędzy" onClose={()=>setSheet(null)}>
   <p className="mu" style={{marginTop:0}}>Wpisz aktualne kwoty. Różnica zapisze się w historii jako korekta.</p>
   <label>💳 Konto ({CUR[cur]})</label><input inputMode="decimal" value={a} onChange={e=>setA(e.target.value)}/>
   <label>🐷 Oszczędności ({CUR[cur]})</label><input inputMode="decimal" value={b} onChange={e=>setB(e.target.value)}/>
   <button className="btn" onClick={save}>Zapisz</button></Sheet>};

 const Inc=()=>{const [v,setV]=useState(String(S.income||''));
  return <Sheet title="Kieszonkowe miesięcznie" onClose={()=>setSheet(null)}>
   <label>Kwota ({CUR[cur]})</label><input inputMode="decimal" value={v} onChange={e=>setV(e.target.value)} placeholder="0" autoFocus/>
   <button className="btn" onClick={()=>{setS(s=>({...s,income:Math.max(0,num(v)||0)}));setSheet(null)}}>Zapisz</button></Sheet>};

 const Cat=({id})=>{const old=S.cats.find(x=>x.id===id);
  const [n,setN]=useState(old?old.name:''),[ic,setIc]=useState(old?old.icon:ICONS[0]),[c,setC]=useState(old?old.color:COLORS[0]),[p,setP]=useState(old?String(old.plan):'');
  const save=()=>{if(!n.trim())return;const o={id:old?old.id:uid(),name:n.trim(),icon:ic,color:c,plan:Math.max(0,num(p)||0)};
   setS(s=>({...s,cats:old?s.cats.map(x=>x.id===o.id?o:x):[...s.cats,o]}));setSheet(null)};
  return <Sheet title={old?'Edytuj kategorię':'Nowa kategoria'} onClose={()=>setSheet(null)}>
   <label>Nazwa</label><input value={n} onChange={e=>setN(e.target.value)} placeholder="np. Jedzenie"/>
   <label>Ile przeznaczasz miesięcznie ({CUR[cur]})</label><input inputMode="decimal" value={p} onChange={e=>setP(e.target.value)} placeholder="0"/>
   <label>Ikona</label><div className="sw">{ICONS.map(i=><i key={i} className={ic===i?'on':''} onClick={()=>setIc(i)}>{i}</i>)}</div>
   <label>Kolor</label><div className="sw">{COLORS.map(x=><i key={x} className={c===x?'on':''} style={{background:x}} onClick={()=>setC(x)}/>)}</div>
   <button className="btn" onClick={save}>Zapisz</button>
   {old&&<button className="btn d" style={{marginTop:10}} onClick={()=>{if(confirm('Usunąć kategorię? Historia zostanie.')){setS(s=>({...s,cats:s.cats.filter(x=>x.id!==old.id)}));setSheet(null)}}}>Usuń kategorię</button>}</Sheet>};

 const Set=()=>{const up=p=>setS(s=>({...s,...p}));
  return <Sheet title="Ustawienia" onClose={()=>setSheet(null)}>
   <label>Waluta</label><select value={cur} onChange={e=>up({cur:e.target.value})}><option value="PLN">PLN (zł)</option><option value="EUR">EUR (€)</option><option value="USD">USD ($)</option></select>
   <label>Motyw</label><div className="seg">{[['dark','Ciemny'],['light','Jasny']].map(([v,l])=><button key={v} className={S.theme===v?'on':''} onClick={()=>up({theme:v})}>{l}</button>)}</div>
   <button className="btn d" onClick={()=>{if(confirm('Usunąć wszystkie dane i zacząć od zera?')){setS(empty());setSheet(null)}}}>Usuń wszystkie dane</button></Sheet>};

 return <>
  {tab==='home'&&<Home/>}{tab==='plan'&&<Plan/>}{tab==='hist'&&<Hist/>}
  <div className="nav g">{[['home','🏠','Start'],['plan','🧮','Podział'],['hist','🕘','Historia']].map(([id,e,l])=>
   <button key={id} className={tab===id?'on':''} onClick={()=>setTab(id)}><span>{e}</span>{l}</button>)}</div>
  {sheet&&sheet.type==='op'&&<Op k0={sheet.k} cat0={sheet.cat}/>}
  {sheet&&sheet.type==='bal'&&<Bal/>}{sheet&&sheet.type==='inc'&&<Inc/>}
  {sheet&&sheet.type==='cat'&&<Cat id={sheet.id}/>}{sheet&&sheet.type==='set'&&<Set/>}
  {toast&&<div className="toast g">{toast}</div>}</>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
